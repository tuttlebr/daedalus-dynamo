model:
  name: gemma-4-31b-it-vllm-agg
  id: nvidia/Gemma-4-31B-IT-NVFP4
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo-vllm-runtime:1.3.0-dev.1
  deploymentMode: direct

worker:
  extraEnv:
    - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
      value: local
    - name: DYN_MULTIMODAL_EMBEDDING_CACHE_GB
      value: "4"
    - name: DYN_MM_ALLOW_INTERNAL
      value: "1"
  vllmArgs:
    - --served-model-name "${MODEL_NAME}"
    - --enable-multimodal
    - --frontend-decoding
    - --multimodal-embedding-cache-capacity-gb "${DYN_MULTIMODAL_EMBEDDING_CACHE_GB}"
    - --mm-processor-cache-gb 8
    - --limit-mm-per-prompt '{"image":4,"audio":1}'
    - --trust-remote-code
    - --dyn-tool-call-parser gemma4
    - --dyn-reasoning-parser gemma4
    - --tensor-parallel-size 1
    - --pipeline-parallel-size 1
    - --data-parallel-size 1
    - --gpu-memory-utilization 0.90
    - --max-num-seqs 8
    - --max-num-batched-tokens 8192
    - --enable-chunked-prefill
    - --scheduling-policy priority
    - --enable-prefix-caching
    - --prefix-caching-hash-algo sha256
    - --kv-cache-dtype fp8
