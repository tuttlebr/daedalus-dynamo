model:
  name: nemotron-3-nano-vllm-agg
  id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo-vllm-runtime:1.3.0-src-de2ad9b-vllm0.25.1-daedalus.1
  deploymentMode: direct

worker:
  extraEnv: []
  vllmArgs:
    - --served-model-name "${MODEL_NAME}"
    - --frontend-decoding
    - --dyn-tool-call-parser nemotron_nano
    - --dyn-reasoning-parser nemotron_nano
    - --tensor-parallel-size 1
    - --pipeline-parallel-size 1
    - --data-parallel-size 1
    - --gpu-memory-utilization 0.90
    - --max-num-seqs 8
    - --max-num-batched-tokens 8192
    - --enable-chunked-prefill
    - --scheduling-policy priority
    - --enable-prefix-caching
    - --prefix-caching-hash-algo sha256
    - --kv-cache-dtype fp8

# The generic Planner "latency" mode only reacts once an aggregated worker is
# above its fixed 40% KV threshold. This model's observed frontend backlog is
# much smaller, so use the tunable load policy as a latency guardrail instead.
# The two KV thresholds are percentages (not fractions): 0.25 means 0.25%.
# On an existing DGD, establish this floor through its scaling adapter; the
# adapter owns live worker replicas after the DGD has been created.
planner:
  optimizationTarget: load
  enableThroughputScaling: false
  enableLoadScaling: true
  preDeploymentSweepingMode: none
  loadAdjustmentIntervalSeconds: 5
  minEndpoint: 1
  maxGpuBudget: 4
  decodeScaleUpKvRate: 0.75
  decodeScaleDownKvRate: 0.05
  advisory: false

modelCache:
  name: nemotronnano-model-cache
  create: true
  storage: 64Gi
  accessModes:
    - ReadWriteMany
  mountPath: /model
  cachePath: /model/.model-express/cache
  storageClassName: ""

redis:
  enabled: true
  name: nemotronnano-redis
  dataPvcName: nemotronnano-redis-data
  image: redis:7-alpine
  imagePullPolicy: Always
  storage: 64Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
