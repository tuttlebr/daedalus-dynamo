# NVIDIA source and intentional Dynamo adaptations: see docs/nvidia-spark-recipes.md.
# https://github.com/NVIDIA/local-ai-inference-recipes/blob/7b2ee453234617f58e1e100c195ac3be7f79e233/models/qwen/qwen3.6-27b/dgx-spark/linux/vllm/recipe.yaml
extends:
- ../../../_shared/nvidia-spark.yaml
recipe:
  upstream:
    url: https://github.com/NVIDIA/local-ai-inference-recipes/blob/7b2ee453234617f58e1e100c195ac3be7f79e233/models/qwen/qwen3.6-27b/dgx-spark/linux/vllm/recipe.yaml
    sha256: 3e0c3976810d2217f8df37be0ac4ae1121ca3aa7d0bf2165ae050581a9f194a4
    minimumMemoryGB: 128
    backendVersion: 0.31.0
  runtime: vllm-031
model:
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo-spark:1.6.1-vllm-031-nvidia-v066-1
  buildDockerfile: runtime/nvidia-spark/vllm-031.Dockerfile
  buildContext: .
  buildPlatform: linux/arm64
frontend:
  runtimeProfile: nvidia/Qwen3.6-27B-NVFP4
  extraArgs:
  - --dyn-chat-processor
  - vllm
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_xml
  - --reasoning-parser
  - qwen3
  - --trust-remote-code
worker:
  runtimeProfile: nvidia/Qwen3.6-27B-NVFP4
  memoryRequest: 65Gi
  prefetchModels: []
  extraEnv:
  - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
    value: '120'
  - name: NCCL_IB_DISABLE
    value: '1'
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
  vllmOptions:
    trust-remote-code: true
    kv-cache-dtype: fp8
    attention-backend: flashinfer
    gpu-memory-utilization: 0.5
    max-model-len: 262144
    max-num-seqs: 8
    max-num-batched-tokens: 8192
    enable-chunked-prefill: true
    async-scheduling: true
    enable-prefix-caching: true
    speculative-config:
      method: mtp
      num_speculative_tokens: 5
    load-format: fastsafetensors
    reasoning-parser: qwen3
    dyn-tool-call-parser: qwen3_xml
    dyn-reasoning-parser: qwen3
    enable-multimodal: true
modelCache:
  storage: 40Gi
