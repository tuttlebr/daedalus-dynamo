# NVIDIA source and intentional Dynamo adaptations: see docs/nvidia-spark-recipes.md.
# https://github.com/NVIDIA/local-ai-inference-recipes/blob/7b2ee453234617f58e1e100c195ac3be7f79e233/models/qwen/qwen3.8-27b/dgx-spark/linux/vllm/128gb/nvfp4/recipe.yaml
extends:
- ../../../_shared/nvidia-spark.yaml
recipe:
  upstream:
    url: https://github.com/NVIDIA/local-ai-inference-recipes/blob/7b2ee453234617f58e1e100c195ac3be7f79e233/models/qwen/qwen3.8-27b/dgx-spark/linux/vllm/128gb/nvfp4/recipe.yaml
    sha256: e93337dda7e5aaf479601766b36109f063ad12cf275761c9d389a61d61ad138d
    minimumMemoryGB: 128
    backendVersion: 0.31.0+88641915.nv26.10.73893335
  runtime: ngc-2610
model:
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo-spark:1.6.1-ngc-2610-nvidia-v066-1
  buildDockerfile: runtime/nvidia-spark/ngc-2610.Dockerfile
  buildContext: .
  buildPlatform: linux/arm64
frontend:
  runtimeProfile: nvidia/Qwen3.8-27B-NVFP4
  extraArgs:
  - --dyn-chat-processor
  - vllm
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_xml
  - --reasoning-parser
  - qwen3
worker:
  runtimeProfile: nvidia/Qwen3.8-27B-NVFP4
  memoryRequest: 77Gi
  prefetchModels:
  - id: z-lab/Qwen3.8-27B-DFlash2
    revision: 50307d4c4cde6860d4eee73e2547cd786fe8e8a4
  extraEnv:
  - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
    value: '120'
  - name: NCCL_IB_DISABLE
    value: '1'
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
  vllmOptions:
    kv-cache-dtype: fp8
    max-model-len: 262144
    max-num-seqs: 8
    async-scheduling: true
    enable-flashinfer-autotune: true
    gpu-memory-utilization: 0.6
    kernel-config:
      linear_backend: nvfp4_dynamic
      nvfp4_dynamic_max_tokens: 16
      unquantized_linear_backend: flashinfer_cudnn
      linear_backend_per_quant:
        fp8_w8a8: cutlass
    speculative-config:
      method: dflash
      model: /model/.model-express/cache/models--z-lab--Qwen3.8-27B-DFlash2/snapshots/50307d4c4cde6860d4eee73e2547cd786fe8e8a4
      num_speculative_tokens: 7
      draft_sample_method: probabilistic
      rejection_sample_method: standard
    compilation-config:
      pass_config:
        fuse_act_quant: true
      max_cudagraph_capture_size: 64
    reasoning-parser: qwen3
    dyn-tool-call-parser: qwen3_xml
    dyn-reasoning-parser: qwen3
    enable-multimodal: true
modelCache:
  storage: 40Gi
