# NVIDIA source and intentional Dynamo adaptations: see docs/nvidia-spark-recipes.md.
# https://github.com/NVIDIA/local-ai-inference-recipes/blob/7b2ee453234617f58e1e100c195ac3be7f79e233/models/qwen/qwen3.5-122b-a10b/dgx-spark/linux/vllm/recipe.yaml
extends:
- ../../../_shared/nvidia-spark.yaml
recipe:
  upstream:
    url: https://github.com/NVIDIA/local-ai-inference-recipes/blob/7b2ee453234617f58e1e100c195ac3be7f79e233/models/qwen/qwen3.5-122b-a10b/dgx-spark/linux/vllm/recipe.yaml
    sha256: 145582f7944824ecb62f1af8c18a6ea3dd0ec6ec72e8a6a998313ab244d9cac0
    minimumMemoryGB: 128
    backendVersion: 0.31.0
  runtime: vllm-031
model:
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo-spark:1.6.1-vllm-031-nvidia-v066-1
  buildDockerfile: runtime/nvidia-spark/vllm-031.Dockerfile
  buildContext: .
  buildPlatform: linux/arm64
frontend:
  runtimeProfile: nvidia/Qwen3.5-122B-A10B-NVFP4
  extraArgs:
  - --dyn-chat-processor
  - vllm
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_xml
  - --reasoning-parser
  - qwen3
worker:
  runtimeProfile: nvidia/Qwen3.5-122B-A10B-NVFP4
  memoryRequest: 102Gi
  prefetchModels: []
  extraEnv:
  - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
    value: '120'
  - name: NCCL_IB_DISABLE
    value: '1'
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
  vllmOptions:
    max-model-len: 262144
    gpu-memory-utilization: 0.8
    max-num-seqs: 8
    load-format: safetensors
    enable-prefix-caching: true
    reasoning-parser: qwen3
    max-num-batched-tokens: 8192
    attention-backend: flashinfer
    kv-cache-dtype: fp8
    moe-backend: marlin
    speculative-config:
      method: mtp
      num_speculative_tokens: 3
      moe_backend: triton
    dyn-tool-call-parser: qwen3_xml
    dyn-reasoning-parser: qwen3
    enable-multimodal: true
modelCache:
  storage: 104Gi
