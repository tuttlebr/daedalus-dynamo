# NVIDIA source and intentional Dynamo adaptations: see docs/nvidia-spark-recipes.md.
# https://github.com/NVIDIA/local-ai-inference-recipes/blob/7b2ee453234617f58e1e100c195ac3be7f79e233/models/qwen/qwen3.8-flash-next/dgx-spark/linux/vllm/fp4-local/recipe.yaml
extends:
- ../../../_shared/nvidia-spark.yaml
recipe:
  upstream:
    url: https://github.com/NVIDIA/local-ai-inference-recipes/blob/7b2ee453234617f58e1e100c195ac3be7f79e233/models/qwen/qwen3.8-flash-next/dgx-spark/linux/vllm/fp4-local/recipe.yaml
    sha256: e00eb23270bbb657ea0bd9b29f66f4a81324be740b7c5eda21b1f299724f226c
    minimumMemoryGB: 128
    backendVersion: 0.1.dev21830+g8244d1c44.d20261015
  runtime: b12x-20261015
model:
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo-spark:1.6.1-b12x-20261015-nvidia-v066-1
  buildDockerfile: runtime/nvidia-spark/b12x-20261015.Dockerfile
  buildContext: .
  buildPlatform: linux/arm64
frontend:
  runtimeProfile: nvidia/Qwen3.8-Flash-Next-FP4-Local
  extraArgs:
  - --dyn-chat-processor
  - vllm
  - --enable-auto-tool-choice
  - --tool-call-parser
  - qwen3_xml
  - --reasoning-parser
  - qwen3
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-GB10
    kubernetes.io/arch: arm64
worker:
  runtimeProfile: nvidia/Qwen3.8-Flash-Next-FP4-Local
  memoryRequest: 102Gi
  prefetchModels: []
  extraEnv:
  - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
    value: '120'
  - name: NCCL_IB_DISABLE
    value: '1'
  - name: VLLM_WORKER_MULTIPROC_METHOD
    value: spawn
  - name: VLLM_PLE_TABLE_MEMORY
    value: disk
  - name: B12X_DISK_BACKEND
    value: io_uring
  - name: CUTE_DSL_ARCH
    value: sm_121a
  - name: SAFETENSORS_FAST_GPU
    value: '1'
  - name: VLLM_SSM_CONV_STATE_LAYOUT
    value: DS
  - name: VLLM_USE_AOT_COMPILE
    value: '1'
  - name: VLLM_USE_MEGA_AOT_ARTIFACT
    value: '1'
  - name: VLLM_USE_V2_MODEL_RUNNER
    value: '1'
  - name: B12X_POLICY_MODE
    value: auto
  - name: VLLM_MXFP8_LM_HEAD
    value: '1'
  - name: VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE
    value: w13
  - name: VLLM_B12X_MOE_FP4_FORCE_A16
    value: '1'
  - name: B12X_W4A16_A4_PREFILL
    value: '1'
  vllmOptions:
    tensor-parallel-size: 1
    pipeline-parallel-size: 1
    mamba-cache-mode: align
    enable-prefix-caching: true
    enable-chunked-prefill: true
    dtype: bfloat16
    kv-cache-dtype: fp8
    quantization: modelopt_mixed
    block-size: 16
    load-format: b12x
    max-model-len: 262144
    max-num-seqs: 8
    max-num-batched-tokens: 4096
    speculative-config:
      method: mtp
      num_speculative_tokens: 4
    gdn-decode-kernel: b12x
    linear-backend: b12x
    moe-backend: b12x
    no-enable-flashinfer-autotune: true
    mm-encoder-tp-mode: data
    reasoning-parser: qwen3
    compilation-config:
      pass_config:
        fuse_act_quant: true
    gpu-memory-utilization: 0.8
    dyn-tool-call-parser: qwen3_xml
    dyn-reasoning-parser: qwen3
    enable-multimodal: true
  securityContext:
    seccompProfile:
      type: Unconfined
    appArmorProfile:
      type: Unconfined
  extraVolumeMounts:
  - name: mx-qwen3-8-flash-next-fp4-spark-tp1-ac7a04-cache
    mountPath: /root/.cache/b12x
    subPath: runtime-cache/b12x
  - name: mx-qwen3-8-flash-next-fp4-spark-tp1-ac7a04-cache
    mountPath: /root/.cache/vllm
    subPath: runtime-cache/vllm
  - name: mx-qwen3-8-flash-next-fp4-spark-tp1-ac7a04-cache
    mountPath: /root/.cache/flashinfer
    subPath: runtime-cache/flashinfer
  - name: mx-qwen3-8-flash-next-fp4-spark-tp1-ac7a04-cache
    mountPath: /root/.triton
    subPath: runtime-cache/triton
modelCache:
  storage: 256Gi
  storageClassName: local-fast
  accessModes:
  - ReadWriteOnce
modelexpress:
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-GB10
    kubernetes.io/arch: arm64
