model:
  name: nemotron-omni-vllm-agg
  id: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo-vllm-runtime:1.3.0-src-de2ad9b-vllm0.25.1-daedalus.1
  deploymentMode: direct

worker:
  extraEnv:
    - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
      value: local
    - name: DYN_MULTIMODAL_EMBEDDING_CACHE_GB
      value: "4"
    - name: DYN_MM_ALLOW_INTERNAL
      value: "1"
    - name: DYN_MM_VIDEO_NUM_FRAMES
      value: "256"
  vllmArgs:
    - --served-model-name "${MODEL_NAME}"
    - --enable-multimodal
    - --frontend-decoding
    - --multimodal-embedding-cache-capacity-gb "${DYN_MULTIMODAL_EMBEDDING_CACHE_GB}"
    - --mm-processor-cache-gb 8
    - --media-io-kwargs '{"video":{"num_frames":256,"fps":1}}'
    - --video-pruning-rate 0.5
    - --trust-remote-code
    - --dyn-tool-call-parser nemotron_nano
    - --dyn-reasoning-parser nemotron_nano
    - --tensor-parallel-size 1
    - --pipeline-parallel-size 1
    - --data-parallel-size 1
    - --gpu-memory-utilization 0.90
    - --max-num-seqs 8
    - --max-num-batched-tokens 8192
    - --enable-chunked-prefill
    - --scheduling-policy priority
    - --enable-prefix-caching
    - --prefix-caching-hash-algo sha256
    - --kv-cache-dtype fp8

planner:
  optimizationTarget: load
  enableThroughputScaling: false
  enableLoadScaling: true
  preDeploymentSweepingMode: none
  loadAdjustmentIntervalSeconds: 5
  minEndpoint: 1
  maxGpuBudget: 4
  decodeScaleUpKvRate: 0.75
  decodeScaleDownKvRate: 0.05
  advisory: false

modelCache:
  name: nemotron-omni-model-cache
  create: true
  storage: 64Gi
  accessModes:
    - ReadWriteMany
  mountPath: /model
  cachePath: /model/.model-express/cache
  storageClassName: ""

redis:
  enabled: true
  name: nemotron-omni-redis
  dataPvcName: nemotron-omni-redis-data
  image: redis:7-alpine
  imagePullPolicy: Always
  storage: 64Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
