model:
  name: qwen36-35b-vllm-agg
  id: nvidia/Qwen3.6-35B-A3B-NVFP4
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo:1.3.0-dev.1
  deploymentMode: direct

worker:
  extraEnv:
    - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
      value: local
    - name: DYN_MULTIMODAL_EMBEDDING_CACHE_GB
      value: "4"
    - name: DYN_MM_ALLOW_INTERNAL
      value: "1"
  vllmArgs:
    - --load-format mx
    - --quantization modelopt
    - --served-model-name "${MODEL_NAME}"
    - --enable-multimodal
    - --frontend-decoding
    - --multimodal-embedding-cache-capacity-gb "${DYN_MULTIMODAL_EMBEDDING_CACHE_GB}"
    - --mm-processor-cache-gb 8
    - --trust-remote-code
    - --dyn-tool-call-parser qwen3_coder
    - --dyn-reasoning-parser qwen3
    - --tensor-parallel-size 1
    - --pipeline-parallel-size 1
    - --data-parallel-size 1
    - --gpu-memory-utilization 0.90
    - --max-num-seqs 8
    - --max-num-batched-tokens 8192
    - --enable-chunked-prefill
    - --scheduling-policy priority
    - --enable-prefix-caching
    - --prefix-caching-hash-algo sha256
    - --kv-cache-dtype fp8
