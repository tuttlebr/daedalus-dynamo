model:
  name: qwen36-35b-vllm-agg
  id: nvidia/Qwen3.6-35B-A3B-NVFP4
  image: daedalus.ddns.me:5050/btuttle/daedalus-dynamo-vllm-runtime:20260717-5930e58
  deploymentMode: direct

worker:
  # Do not apply the legacy 0.22-only source patch to the shared runtime.
  applyVllmModelOptLmHeadPatch: false
  extraEnv:
    - name: DYN_MM_ALLOW_INTERNAL
      value: "1"
  # Keep the standard safetensors loader. ModelExpress still owns cache
  # population and the worker readiness gate.
  vllmArgs:
    - --quantization modelopt
    - --served-model-name "${MODEL_NAME}"
    - --moe-backend marlin
    - --frontend-decoding
    - --trust-remote-code
    - --dyn-tool-call-parser qwen3_coder
    - --dyn-reasoning-parser qwen3
    - --tensor-parallel-size 1
    - --pipeline-parallel-size 1
    - --data-parallel-size 1
    - --gpu-memory-utilization 0.90
    - --max-num-seqs 4
    - --max-num-batched-tokens 4096
    - --enable-chunked-prefill
    - --scheduling-policy priority
    - --enable-prefix-caching
    - --prefix-caching-hash-algo sha256
    - --kv-cache-dtype fp8
    - --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'

# The generic Planner "latency" mode only reacts once an aggregated worker is
# above its fixed 40% KV threshold. This model's observed frontend backlog is
# much smaller, so use the tunable load policy as a latency guardrail instead.
# The two KV thresholds are percentages (not fractions): 0.25 means 0.25%.
# On an existing DGD, establish this floor through its scaling adapter; the
# adapter owns live worker replicas after the DGD has been created.
planner:
  optimizationTarget: load
  enableThroughputScaling: false
  enableLoadScaling: true
  preDeploymentSweepingMode: none
  loadAdjustmentIntervalSeconds: 5
  minEndpoint: 1
  maxGpuBudget: 4
  decodeScaleUpKvRate: 0.25
  decodeScaleDownKvRate: 0.05
  advisory: false

modelCache:
  name: qwen35b-model-cache
  create: true
  storage: 64Gi
  accessModes:
    - ReadWriteMany
  mountPath: /model
  cachePath: /model/.model-express/cache
  storageClassName: ""

redis:
  enabled: true
  name: qwen35b-redis
  dataPvcName: qwen35b-redis-data
  image: redis:7-alpine
  imagePullPolicy: Always
  storage: 64Gi
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
