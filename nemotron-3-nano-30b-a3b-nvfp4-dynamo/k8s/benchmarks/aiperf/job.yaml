apiVersion: batch/v1
kind: Job
metadata:
  name: aiperf-router-demo
  labels:
    app.kubernetes.io/name: aiperf-router-demo
    app.kubernetes.io/part-of: nemotron3nano-photo-demo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiperf-router-demo
        app.kubernetes.io/part-of: nemotron3nano-photo-demo
    spec:
      restartPolicy: Never
      containers:
        - name: aiperf
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              case "${AIPERF_PIP_SPEC} ${EXTRA_PIP_PACKAGES}" in
                *git+*)
                  apt-get update
                  apt-get install -y --no-install-recommends git
                  rm -rf /var/lib/apt/lists/*
                  ;;
              esac
              python -m pip install --upgrade --disable-pip-version-check pip
              python -m pip install --no-cache-dir "${AIPERF_PIP_SPEC}" ${EXTRA_PIP_PACKAGES}
              python /scripts/run-aiperf-router-demo.py
          envFrom:
            - configMapRef:
                name: aiperf-router-demo-config
            - secretRef:
                name: hf-token-secret
                optional: true
          env:
            - name: HF_HOME
              value: /results/hf
            - name: HF_HUB_CACHE
              value: /results/hf/hub
            - name: TRANSFORMERS_CACHE
              value: /results/hf/transformers
            - name: AIPERF_ARTIFACT_ROOT
              value: /results/aiperf-router-demo
            - name: PYTHONPATH
              value: /scripts
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
      volumes:
        - name: scripts
          configMap:
            name: aiperf-router-demo-scripts
            defaultMode: 0555
        - name: results
          persistentVolumeClaim:
            claimName: aiperf-router-demo-results
