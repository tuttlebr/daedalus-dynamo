app:
  partOf: daedalus-dynamo

model:
  name: example-vllm-agg
  # Metadata on a directly rendered DynamoGraphDeployment, not its pods.
  annotations: {}
  id: nvidia/example-model
  image: example.com/dynamo-model:latest
  imagePullPolicy: IfNotPresent
  backendFramework: vllm
  deploymentMode: direct
  envFromSecret: hf-token-secret
  # Set for custom images whose tag is not the Dynamo runtime version.
  runtimeVersionOverride: ""

modelCache:
  name: dynamo-model-cache
  create: true
  storage: 256Gi
  accessModes:
    - ReadWriteMany
  mountPath: /model
  cachePath: /model/.model-express/cache
  storageClassName: ""

redis:
  enabled: true
  name: dynamo-redis
  dataPvcName: dynamo-redis-data
  image: redis:8.10.3-alpine
  imagePullPolicy: IfNotPresent
  storage: 256Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-fast
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

modelexpress:
  # Existing cache volumes were populated by the earlier root-based image.
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
  enabled: true
  # Pin every model-cache consumer when using a node-local RWO volume.
  nodeSelector: {}
  tolerations: []
  image: nvcr.io/nvidia/ai-dynamo/modelexpress-server:0.7.0
  imagePullPolicy: IfNotPresent
  port: 8000
  logLevel: info
  metadataBackend: redis
  downloadStrategy: server-only
  # Optional Hugging Face revision for the cache server download.
  modelRevision: ""
  resetRegistryOnStart: true
  waitForCacheReady: true
  resources:
    requests:
      cpu: 100m
      memory: 1536Mi
    limits:
      cpu: "2"
      memory: 4Gi

frontend:
  # A separate frontend image can supply native transport features while a
  # model-specific worker image supplies a newer inference engine.
  image: ""
  # Start each model release with one CPU-only frontend.
  replicas: 1
  # Optional Kubernetes nodeSelector for the CPU-only frontend. This is useful
  # when the shared runtime image should reuse layers on a model worker node.
  nodeSelector: {}
  tolerations: []
  httpPort: 8000
  httpBodyLimitMb: "200"
  requestPlane: tcp
  eventPlane: zmq
  nofileLimit: "131072"
  tokenizer: fastokens
  queuePolicy: wspt
  routerMode: kv
  minInitialWorkers: 1
  # Additional frontend CLI arguments for direct deployments. Each list item
  # is one literal argv token, including values that contain spaces or JSON.
  extraArgs: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

worker:
  annotations: {}
  componentName: VllmWorker
  replicas: 1
  scalingAdapter:
    enabled: true
  gpu: "1"
  cpuRequest: "2"
  cpuLimit: ""
  memoryRequest: 8Gi
  memoryLimit: ""
  httpBodyLimitMb: "400"
  requestPlane: tcp
  eventPlane: zmq
  nofileLimit: "131072"
  sharedMemorySize: 16Gi
  ucxNetDevices: eth0
  ucxTls: tcp,cuda_copy,cuda_ipc
  nodeGpuMemoryGt: "40959"
  # Set this to select GPUs below a memory size instead of nodeGpuMemoryGt.
  nodeGpuMemoryLt: ""
  # A direct selector takes precedence over the GPU-memory affinity above.
  nodeSelector: {}
  tolerations: []
  workingDir: ""
  securityContext: {}
  startupProbe:
    path: /health
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 360
  # Temporary vLLM 0.22.0 backport of upstream PR #42124. Enable only for
  # ModelOpt checkpoints whose separately quantized lm_head needs that fix.
  applyVllmModelOptLmHeadPatch: false
  customJinjaTemplate:
    enabled: false
    sourceFile: ""
    mountPath: ""
  extraEnv: []
  vllmArgs:
    - --served-model-name "${MODEL_NAME}"
    - --frontend-decoding
    - --tensor-parallel-size 1
    - --pipeline-parallel-size 1
    - --data-parallel-size 1
    - --gpu-memory-utilization 0.90
    - --max-num-seqs 8
    - --max-num-batched-tokens 8192
    - --enable-chunked-prefill
    - --scheduling-policy priority
    - --enable-prefix-caching
    - --prefix-caching-hash-algo sha256
    - --kv-cache-dtype fp8
  trtllm:
    engineConfig: {}
    args: []

planner:
  enabled: true
  image: nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.6.0
  imagePullPolicy: IfNotPresent
  environment: kubernetes
  mode: agg
  optimizationTarget: load
  enableThroughputScaling: false
  enableLoadScaling: true
  preDeploymentSweepingMode: none
  throughputAdjustmentIntervalSeconds: 120
  loadAdjustmentIntervalSeconds: 5
  throughputMetricsSource: frontend
  maxGpuBudget: 2
  minEndpoint: 1
  ttftMs: 1500.0
  itlMs: 75.0
  advisory: false
  decodeScaleUpKvRate: .8
  decodeScaleDownKvRate: .3
  prometheusEndpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  prometheusPort: "0"
  eventPlane: zmq
  workerNamespaceCompat: "off"
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
  dgdr:
    searchStrategy: thorough
    autoApply: true
    workload:
      # Planning proxy only. ISL/OSL require a representative trace before a
      # DGDR result can be treated as performance-qualified.
      isl: 4096
      osl: 512
      concurrency: 3
    hardware:
      gpuSku: l40s
      totalGpus: 4
      numGpusPerNode: 2
      vramMb: 46068
  compatHook:
    enabled: false
    image: bitnami/kubectl:1.35.3
    waitSeconds: 600
    restartPlanner: true

metrics:
  podMonitor:
    enabled: false
    name: dynamo-decode-worker
    namespace: dynamo-system
    partOf: daedalus-dynamo-demo
    interval: 5s
    # Enable only when a worker actually exposes the separate NIXL metrics port.
    nixlEnabled: false

availability:
  podDisruptionBudgets:
    enabled: true
    frontendMinAvailable: 1
    workerMinAvailable: 1
