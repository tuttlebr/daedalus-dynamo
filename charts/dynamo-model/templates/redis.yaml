{{- if .Values.redis.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.redis.dataPvcName | quote }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "dynamo-model.redisSelectorLabels" . | nindent 4 }}
    {{- if .Values.app.partOf }}
    app.kubernetes.io/part-of: {{ .Values.app.partOf | quote }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.redis.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.redis.storage | quote }}
  {{- include "dynamo-model.storageClass" .Values.redis | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.name | quote }}
  labels:
    {{- include "dynamo-model.redisSelectorLabels" . | nindent 4 }}
    {{- if .Values.app.partOf }}
    app.kubernetes.io/part-of: {{ .Values.app.partOf | quote }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "dynamo-model.redisSelectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.name | quote }}
  labels:
    {{- include "dynamo-model.redisSelectorLabels" . | nindent 4 }}
    {{- if .Values.app.partOf }}
    app.kubernetes.io/part-of: {{ .Values.app.partOf | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dynamo-model.redisSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dynamo-model.redisSelectorLabels" . | nindent 8 }}
        {{- if .Values.app.partOf }}
        app.kubernetes.io/part-of: {{ .Values.app.partOf | quote }}
        {{- end }}
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: {{ .Values.redis.imagePullPolicy }}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          args:
            - --appendonly
            - "yes"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ .Values.redis.dataPvcName | quote }}
{{- end }}
