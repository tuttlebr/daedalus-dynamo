{{- if eq .Values.model.deploymentMode "direct" }}
# This template uses the v1alpha1 services/pvcs schema. Migrating to v1beta1
# also requires converting the spec to components/podTemplate.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: {{ include "dynamo-model.name" . | quote }}
  labels:
    {{- include "dynamo-model.labels" . | nindent 4 }}
spec:
  backendFramework: {{ .Values.model.backendFramework }}
  pvcs:
    - name: {{ .Values.modelCache.name | quote }}
      create: false
  services:
    Frontend:
      componentType: frontend
      envFromSecret: {{ .Values.model.envFromSecret | quote }}
      replicas: {{ .Values.frontend.replicas }}
      volumeMounts:
        - name: {{ .Values.modelCache.name | quote }}
          mountPoint: {{ .Values.modelCache.mountPath | quote }}
      extraPodSpec:
        {{- with .Values.frontend.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        mainContainer:
          image: {{ .Values.model.image | quote }}
          imagePullPolicy: {{ .Values.model.imagePullPolicy }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.httpPort }}
            periodSeconds: 10
            timeoutSeconds: 1800
            failureThreshold: 60
          env:
            - name: HF_HUB_CACHE
              value: {{ .Values.modelCache.cachePath | quote }}
            - name: DYN_HTTP_BODY_LIMIT_MB
              value: {{ .Values.frontend.httpBodyLimitMb | quote }}
            - name: DYN_REQUEST_PLANE
              value: {{ .Values.frontend.requestPlane | quote }}
            - name: DYN_EVENT_PLANE
              value: {{ .Values.frontend.eventPlane | quote }}
            - name: DYN_FRONTEND_NOFILE_LIMIT
              value: {{ .Values.frontend.nofileLimit | quote }}
            - name: DYN_TOKENIZER
              value: {{ .Values.frontend.tokenizer | quote }}
            - name: DYN_ROUTER_QUEUE_POLICY
              value: {{ .Values.frontend.queuePolicy | quote }}
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              ulimit -S -n "${DYN_FRONTEND_NOFILE_LIMIT}"
              if (( $(ulimit -S -n) < DYN_FRONTEND_NOFILE_LIMIT )); then
                echo "ERROR: frontend RLIMIT_NOFILE is below ${DYN_FRONTEND_NOFILE_LIMIT}" >&2
                exit 78
              fi
              echo "Frontend RLIMIT_NOFILE soft=$(ulimit -S -n) hard=$(ulimit -H -n)"
              unset NATS_SERVER &&
              exec python3 -m dynamo.frontend \
              --router-mode {{ .Values.frontend.routerMode }} \
              --no-router-kv-events \
              --router-min-initial-workers {{ .Values.frontend.minInitialWorkers }} \
              --enable-anthropic-api \
              --strip-anthropic-preamble \
              --enable-streaming-tool-dispatch \
              --enable-streaming-reasoning-dispatch \
              --http-port {{ .Values.frontend.httpPort }} \
              --active-decode-blocks-threshold "None" \
              --active-prefill-tokens-threshold "None" \
              --active-prefill-tokens-threshold-frac "None" \
              --router-track-output-blocks
    {{- if .Values.modelexpress.enabled }}
    ModelExpress:
      componentType: frontend
      envFromSecret: {{ .Values.model.envFromSecret | quote }}
      replicas: 1
      livenessProbe:
        tcpSocket:
          port: {{ .Values.modelexpress.port }}
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        tcpSocket:
          port: {{ .Values.modelexpress.port }}
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      volumeMounts:
        - name: {{ .Values.modelCache.name | quote }}
          mountPoint: {{ .Values.modelCache.mountPath | quote }}
      extraPodSpec:
        mainContainer:
          image: {{ .Values.modelexpress.image | quote }}
          imagePullPolicy: {{ .Values.modelexpress.imagePullPolicy }}
          env:
            - name: MODEL_EXPRESS_SERVER_PORT
              value: {{ .Values.modelexpress.port | quote }}
            - name: MODEL_EXPRESS_LOG_LEVEL
              value: {{ .Values.modelexpress.logLevel | quote }}
            - name: MODEL_EXPRESS_CACHE_DIRECTORY
              value: {{ .Values.modelCache.cachePath | quote }}
            - name: MX_METADATA_BACKEND
              value: {{ .Values.modelexpress.metadataBackend | quote }}
            - name: MX_REDIS_HOST
              value: {{ .Values.redis.name | quote }}
            - name: MX_REDIS_PORT
              value: "6379"
            - name: REDIS_URL
              value: {{ printf "redis://%s:6379" .Values.redis.name | quote }}
            - name: MODEL_NAME
              value: {{ .Values.model.id | quote }}
            - name: MODEL_CACHE_PATH
              value: {{ .Values.modelCache.cachePath | quote }}
            - name: HF_HUB_CACHE
              value: {{ .Values.modelCache.cachePath | quote }}
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail

              echo "Waiting for Redis metadata backend..."
              for i in $(seq 1 60); do
                if timeout 1 bash -c "</dev/tcp/${MX_REDIS_HOST}/${MX_REDIS_PORT}" 2> /dev/null; then
                  echo "Redis is reachable."
                  break
                fi
                if [ "$i" -eq 60 ]; then
                  echo "ERROR: Redis did not become reachable at ${MX_REDIS_HOST}:${MX_REDIS_PORT}" >&2
                  exit 1
                fi
                echo "Waiting for Redis... ($i/60)"
                sleep 2
              done

              {{- if .Values.modelexpress.waitForCacheReady }}
              # Invalidate the completion marker before exposing the server.
              # Workers wait for ModelExpress TCP readiness first, so they
              # cannot observe a stale link from an earlier cache attempt.
              MODEL_SNAPSHOTS_PARENT="$MODEL_CACHE_PATH/models--${MODEL_NAME//\//--}/snapshots"
              MODEL_READY_LINK="$MODEL_SNAPSHOTS_PARENT/latest"
              if [ -L "$MODEL_READY_LINK" ]; then
                unlink "$MODEL_READY_LINK"
                echo "Invalidated stale ModelExpress cache-ready marker."
              fi
              {{- end }}

              {{- if .Values.modelexpress.resetRegistryOnStart }}
              # ModelExpress 0.4.1 persists DOWNLOADING in Redis, but an
              # interrupted downloader does not reclaim that state on restart.
              # Remove only this model's registry record; cached blobs remain
              # intact and the provider resumes or validates them below.
              MODEL_REGISTRY_KEY="mx:model:HuggingFace:${MODEL_NAME}"
              MODEL_REGISTRY_KEY_BYTES=${#MODEL_REGISTRY_KEY}
              exec 3<>"/dev/tcp/${MX_REDIS_HOST}/${MX_REDIS_PORT}"
              printf '*2\r\n$3\r\nDEL\r\n$%s\r\n%s\r\n' \
                "$MODEL_REGISTRY_KEY_BYTES" "$MODEL_REGISTRY_KEY" >&3
              IFS= read -r REDIS_RESET_REPLY <&3 || true
              exec 3>&-
              exec 3<&-
              echo "Reset ModelExpress registry before cache reconciliation (${REDIS_RESET_REPLY:-no reply})."
              {{- end }}

              echo "Starting Model Express Server..."
              ./modelexpress-server &

              SERVER_PID=$!
              echo "Server started with PID: $SERVER_PID"

              echo "Setting up Model Express configuration..."
              mkdir -p "$MODEL_CACHE_PATH"
              mkdir -p {{ .Values.modelCache.mountPath }}/.model-express
              cat > {{ .Values.modelCache.mountPath }}/.model-express/config.yaml << EOF
              local_path: $MODEL_CACHE_PATH
              server_endpoint: http://{{ include "dynamo-model.name" . }}-modelexpress:{{ .Values.modelexpress.port }}
              timeout_secs: null
              EOF

              echo "Waiting for server to be ready..."
              for i in $(seq 1 60); do
                if ./modelexpress-cli --endpoint http://localhost:{{ .Values.modelexpress.port }} health > /dev/null 2>&1; then
                  echo "Server is ready!"
                  break
                fi
                echo "Waiting for server... ($i/60)"
                sleep 2
              done

              echo "Downloading $MODEL_NAME model..."
              ./modelexpress-cli --endpoint http://localhost:{{ .Values.modelexpress.port }} \
                --cache-path "$MODEL_CACHE_PATH" \
                model download "$MODEL_NAME" --strategy {{ .Values.modelexpress.downloadStrategy }}

              SNAPSHOTS_PARENT="$MODEL_CACHE_PATH/models--${MODEL_NAME//\//--}/snapshots"
              SNAPSHOT_DIR="$(ls -td "$SNAPSHOTS_PARENT"/*/ 2>/dev/null | head -1 || true)"
              if [ -n "$SNAPSHOT_DIR" ]; then
                SNAPSHOTS_PARENT=$(dirname "$SNAPSHOT_DIR")
                ln -sfn "$(basename "$SNAPSHOT_DIR")" "$SNAPSHOTS_PARENT/latest"
                echo "Created symlink: latest -> $(basename "$SNAPSHOT_DIR")"
              fi

              echo "Server PID: $SERVER_PID"
              wait "$SERVER_PID"
    {{- end }}
    {{- if .Values.planner.enabled }}
    Planner:
      envFromSecret: {{ .Values.model.envFromSecret | quote }}
      componentType: planner
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: {{ .Values.planner.image | quote }}
          imagePullPolicy: {{ .Values.planner.imagePullPolicy }}
          env:
            - name: DYN_EVENT_PLANE
              value: {{ .Values.planner.eventPlane | quote }}
            - name: PROMETHEUS_ENDPOINT
              value: {{ .Values.planner.prometheusEndpoint | quote }}
            - name: PLANNER_PROMETHEUS_PORT
              value: {{ .Values.planner.prometheusPort | quote }}
          {{- if ne (toString .Values.planner.prometheusPort) "0" }}
          ports:
            - name: planner-metrics
              containerPort: {{ .Values.planner.prometheusPort }}
          {{- end }}
          {{- if eq .Values.planner.workerNamespaceCompat "legacy" }}
          command:
            - python3
            - -c
          args:
            - |
              {{- include "dynamo-model.plannerLegacyNamespacePatch" . | nindent 14 }}
            - --config
            - >-
              {{ include "dynamo-model.plannerConfigJson" . }}
          {{- else }}
          command:
            - python3
            - -m
            - dynamo.planner
          args:
            - --config
            - >-
              {{ include "dynamo-model.plannerConfigJson" . }}
          {{- end }}
          resources:
            {{- toYaml .Values.planner.resources | nindent 12 }}
    {{- end }}
    {{ .Values.worker.componentName }}:
      componentType: worker
      subComponentType: decode
      scalingAdapter:
        enabled: true
      envFromSecret: {{ .Values.model.envFromSecret | quote }}
      replicas: {{ .Values.worker.replicas }}
      resources:
        limits:
          gpu: {{ .Values.worker.gpu | quote }}
        requests:
          gpu: {{ .Values.worker.gpu | quote }}
      livenessProbe:
        httpGet:
          path: /live
          port: system
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /health
          port: system
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      volumeMounts:
        - name: {{ .Values.modelCache.name | quote }}
          mountPoint: {{ .Values.modelCache.mountPath | quote }}
      sharedMemory:
        size: {{ .Values.worker.sharedMemorySize | quote }}
      extraPodSpec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nvidia.com/gpu.memory
                      {{- if .Values.worker.nodeGpuMemoryLt }}
                      operator: Lt
                      values:
                        - {{ .Values.worker.nodeGpuMemoryLt | quote }}
                      {{- else }}
                      operator: Gt
                      values:
                        - {{ .Values.worker.nodeGpuMemoryGt | quote }}
                      {{- end }}
        mainContainer:
          image: {{ .Values.model.image | quote }}
          imagePullPolicy: {{ .Values.model.imagePullPolicy }}
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          env:
            - name: MODEL_NAME
              value: {{ .Values.model.id | quote }}
            - name: HF_HUB_CACHE
              value: {{ .Values.modelCache.cachePath | quote }}
            - name: MODEL_CACHE_PATH
              value: {{ .Values.modelCache.cachePath | quote }}
            - name: MODEL_EXPRESS_URL
              value: {{ printf "http://%s-modelexpress:%v" (include "dynamo-model.name" .) .Values.modelexpress.port | quote }}
            - name: MODEL_EXPRESS_HOST
              value: {{ printf "%s-modelexpress" (include "dynamo-model.name" .) | quote }}
            - name: MODEL_EXPRESS_PORT
              value: {{ .Values.modelexpress.port | quote }}
            - name: DYN_REQUEST_PLANE
              value: {{ .Values.worker.requestPlane | quote }}
            - name: DYN_EVENT_PLANE
              value: {{ .Values.worker.eventPlane | quote }}
            - name: DYN_HTTP_BODY_LIMIT_MB
              value: {{ .Values.worker.httpBodyLimitMb | quote }}
            - name: DYN_WORKER_NOFILE_LIMIT
              value: {{ .Values.worker.nofileLimit | quote }}
            - name: UCX_NET_DEVICES
              value: {{ .Values.worker.ucxNetDevices | quote }}
            - name: UCX_TLS
              value: {{ .Values.worker.ucxTls | quote }}
            {{- range .Values.worker.extraEnv }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              ulimit -S -n "${DYN_WORKER_NOFILE_LIMIT}"
              if (( $(ulimit -S -n) < DYN_WORKER_NOFILE_LIMIT )); then
                echo "ERROR: worker RLIMIT_NOFILE is below ${DYN_WORKER_NOFILE_LIMIT}" >&2
                exit 78
              fi
              echo "Worker RLIMIT_NOFILE soft=$(ulimit -S -n) hard=$(ulimit -H -n)"

              echo "Waiting for ModelExpress at ${MODEL_EXPRESS_HOST}:${MODEL_EXPRESS_PORT}..."
              for i in $(seq 1 180); do
                if timeout 1 bash -c "</dev/tcp/${MODEL_EXPRESS_HOST}/${MODEL_EXPRESS_PORT}" 2> /dev/null; then
                  echo "ModelExpress is reachable."
                  break
                fi
                if [ "$i" -eq 180 ]; then
                  echo "ERROR: ModelExpress did not become reachable at ${MODEL_EXPRESS_HOST}:${MODEL_EXPRESS_PORT}" >&2
                  exit 1
                fi
                echo "Waiting for ModelExpress... ($i/180)"
                sleep 2
              done

              {{- if .Values.modelexpress.waitForCacheReady }}
              MODEL_SNAPSHOTS_PARENT="$MODEL_CACHE_PATH/models--${MODEL_NAME//\//--}/snapshots"
              MODEL_READY_LINK="$MODEL_SNAPSHOTS_PARENT/latest"
              echo "Waiting for ModelExpress to finish the shared-cache download..."
              while [ ! -L "$MODEL_READY_LINK" ] || [ ! -d "$MODEL_READY_LINK" ]; do
                sleep 5
              done
              echo "Model cache is ready at $MODEL_READY_LINK."
              {{- end }}

              {{- if .Values.worker.applyVllmModelOptLmHeadPatch }}
              # vLLM PR #42124 landed after 0.22.0 and fixes ModelOpt
              # checkpoints with a separately quantized ParallelLMHead.
              # Apply only those upstream source changes in this ephemeral
              # container, with strict version and source-layout guards.
              echo "Applying vLLM 0.22.0 ModelOpt LM-head compatibility patch..."
              python3 - <<'PY'
              from importlib.metadata import version
              from pathlib import Path

              expected_version = "0.22.0"
              actual_version = version("vllm")
              if actual_version != expected_version:
                  raise RuntimeError(
                      "Refusing vLLM ModelOpt LM-head patch: expected "
                      f"{expected_version}, found {actual_version}"
                  )

              package = Path("/usr/local/lib/python3.12/dist-packages/vllm/model_executor")

              def replace_exact(
                  path: Path, before: str, after: str, expected_count: int = 1
              ) -> None:
                  text = path.read_text()
                  before_count = text.count(before)
                  after_count = text.count(after)
                  if before_count == 0 and after_count >= expected_count:
                      return
                  if before_count != expected_count or after_count != 0:
                      raise RuntimeError(
                          f"Refusing unexpected vLLM source layout in {path}: "
                          f"before={before_count}, after={after_count}"
                      )
                  path.write_text(text.replace(before, after, expected_count))

              modelopt = package / "layers/quantization/modelopt.py"
              replace_exact(
                  modelopt,
                  "from vllm.model_executor.parameter import (\n",
                  "from vllm.model_executor.layers.vocab_parallel_embedding "
                  "import ParallelLMHead\n"
                  "from vllm.model_executor.parameter import (\n",
              )
              replace_exact(
                  modelopt,
                  "if isinstance(layer, LinearBase):",
                  "if isinstance(layer, (LinearBase, ParallelLMHead)):",
                  expected_count=4,
              )

              vocab = package / "layers/vocab_parallel_embedding.py"
              replace_exact(
                  vocab,
                  "        if params_dtype is None:\n"
                  "            params_dtype = torch.get_default_dtype()\n"
                  "        # Divide the weight matrix along the vocabulary dimension.\n",
                  "        if params_dtype is None:\n"
                  "            params_dtype = torch.get_default_dtype()\n"
                  "        self.params_dtype = params_dtype\n"
                  "        # Divide the weight matrix along the vocabulary dimension.\n",
              )
              replace_exact(
                  vocab,
                  "        if output_dim is None:\n"
                  "            assert param.data.shape == loaded_weight.shape\n",
                  "        if output_dim is None:\n"
                  "            if (\n"
                  "                loaded_weight.ndim == 0\n"
                  "                and param.data.ndim == 1\n"
                  "                and param.data.numel() == 1\n"
                  "            ):\n"
                  "                loaded_weight = loaded_weight.reshape(1)\n"
                  "            assert param.data.shape == loaded_weight.shape\n",
              )

              quant_config_arg = (
                  "                    config.hidden_size,\n"
                  "                    prefix=maybe_prefix(prefix, \"lm_head\"),\n"
              )
              quant_config_fix = (
                  "                    config.hidden_size,\n"
                  "                    quant_config=self.quant_config,\n"
                  "                    prefix=maybe_prefix(prefix, \"lm_head\"),\n"
              )
              replace_exact(
                  package / "models/qwen3_5.py",
                  quant_config_arg,
                  quant_config_fix,
              )
              replace_exact(
                  package / "models/qwen3_5_mtp.py",
                  quant_config_arg,
                  quant_config_fix,
              )
              print("Applied vLLM ModelOpt LM-head compatibility patch.")
              PY
              {{- end }}

              exec python3 -m dynamo.vllm \
                --model "${MODEL_NAME}" \
                {{- range .Values.worker.vllmArgs }}
                {{ . }} \
                {{- end }}
                --no-enable-log-requests
{{- end }}
