nats:
  container:
    image:
      repository: daedalus.ddns.me:5050/btuttle/daedalus-nats
      tag: 2.15.2
    merge:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
  reloader:
    image:
      tag: 0.25.0
    merge:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
  config:
    jetstream:
      fileStore:
        pvc:
          storageClassName: local-fast
  podTemplate:
    merge:
      spec:
        nodeSelector:
          kubernetes.io/hostname: daedalus-03
dynamo-operator:
  controllerManager:
    manager:
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
