model:
  name: qwen36-27b-vllm-agg
  id: Qwen/Qwen3.8-27B-FP8
  image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.0
  imagePullPolicy: IfNotPresent
  backendFramework: vllm
  deploymentMode: direct

frontend:
  replicas: 1

worker:
  # The Daedalus agent proxy favored one fixed TP2 endpoint over two TP1
  # endpoints on fresh latency tails and throughput. Keep PodClique at one
  # worker and allocate both L40S devices to that worker.
  replicas: 1
  scalingAdapter:
    enabled: false
  gpu: "2"
  extraEnv:
    - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
      value: local
    - name: DYN_MULTIMODAL_EMBEDDING_CACHE_GB
      value: "4"
    - name: DYN_MM_ALLOW_INTERNAL
      value: "1"
  vllmArgs:
    - --load-format mx
    - --quantization fp8
    - --served-model-name "${MODEL_NAME}"
    - --enable-multimodal
    - --frontend-decoding
    - --multimodal-embedding-cache-capacity-gb "${DYN_MULTIMODAL_EMBEDDING_CACHE_GB}"
    - --mm-processor-cache-gb 8
    - --trust-remote-code
    - --dyn-tool-call-parser qwen3_coder
    - --dyn-reasoning-parser qwen3
    - --tensor-parallel-size 2
    - --pipeline-parallel-size 1
    - --data-parallel-size 1
    - --gpu-memory-utilization 0.90
    - --max-num-seqs 8
    - --max-num-batched-tokens 8192
    - --enable-chunked-prefill
    - --scheduling-policy priority
    - --enable-prefix-caching
    - --prefix-caching-hash-algo sha256
    - --kv-cache-dtype fp8

# The generic Planner "latency" mode only reacts once an aggregated worker is
# above its fixed 40% KV threshold. This model's observed frontend backlog is
# much smaller, so use the tunable load policy as a latency guardrail instead.
# The two KV thresholds are percentages (not fractions): 0.25 means 0.25%.
# This deployment is intentionally fixed-capacity; advisory mode observes the
# load policy without mutating the single TP2 PodClique worker count.
planner:
  optimizationTarget: load
  enableThroughputScaling: false
  enableLoadScaling: true
  preDeploymentSweepingMode: none
  loadAdjustmentIntervalSeconds: 5
  minEndpoint: 1
  maxGpuBudget: 2
  decodeScaleUpKvRate: 0.25
  decodeScaleDownKvRate: 0.05
  advisory: true

modelCache:
  name: qwen27b-model-cache
  create: true
  storage: 64Gi
  accessModes:
    - ReadWriteMany
  mountPath: /model
  cachePath: /model/.model-express/cache
  storageClassName: ""

redis:
  enabled: true
  name: qwen27b-redis
  dataPvcName: qwen27b-redis-data
  image: redis:8.10.3-alpine
  imagePullPolicy: IfNotPresent
  storage: 64Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: local-fast
