services:
  aiperf:
    build:
      context: .
      dockerfile: Dockerfile
    image: daedalus-dynamo-aiperf:0.11.0
    init: true
    user: "${AIPERF_UID:-65532}:${AIPERF_GID:-65532}"
    extra_hosts:
      - "daedalus.ddns.me:${ENDPOINT_CONNECT_IP:-192.168.1.234}"
    environment:
      ENDPOINT_URL: "${ENDPOINT_URL:-https://daedalus.ddns.me:32359}"
      GPU_TELEMETRY: "${GPU_TELEMETRY-192.168.1.235:32400/metrics}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TURNS: "${TURNS:-5}"
      CONCURRENCY: "${CONCURRENCY:-3}"
      DATASET_SESSIONS: "${DATASET_SESSIONS:-128}"
      BENCHMARK_DURATION_SECONDS: "${BENCHMARK_DURATION_SECONDS:-1800}"
      MODEL_TIMEOUT_SECONDS: "${MODEL_TIMEOUT_SECONDS:-7200}"
      TOKENIZER: "${TOKENIZER:-auto}"
      USE_SERVER_TOKEN_COUNT: "${USE_SERVER_TOKEN_COUNT:-1}"
      STOP_ON_ERROR: "${STOP_ON_ERROR:-0}"
      HF_HOME: /artifacts
    env_file:
      - ../../.env
    volumes:
      - ../../artifacts/aiperf:/artifacts
