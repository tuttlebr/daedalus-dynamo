apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - results-pvc.yaml
  - job.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: aiperf-router-demo
    app.kubernetes.io/part-of: qwen36-photo-demo

configMapGenerator:
  - name: aiperf-router-demo-config
    literals:
      - AIPERF_PIP_SPEC=aiperf==0.11.0
      - EXTRA_PIP_PACKAGES=
      - ENDPOINT_URL=http://qwen36-35b-vllm-agg-frontend:8000
      - MODEL_NAME=nvidia/Qwen3.6-35B-A3B-NVFP4
      - TOKENIZER_NAME=nvidia/Qwen3.6-35B-A3B-NVFP4
      - TOKENIZER_TRUST_REMOTE_CODE=true
      - PREFIX_RATIOS=0.1,0.5,0.9
      - INPUT_SEQUENCE_LENGTH=4096
      - OUTPUT_SEQUENCE_LENGTH=128
      - REQUEST_COUNT=1000
      - CONCURRENCY=4
      - NUM_PREFIX_PROMPTS=8
      - DYNAMO_AGENT_HINTS_ENABLED=true
      - DYNAMO_AGENT_HINTS_DYNAMIC_OSL=true
      - DYNAMO_AGENT_HINTS_JSON=
      - REQUEST_PRIORITY=5
      - USE_EXPECTED_OSL=true
      - SPECULATIVE_PREFILL=false
      - DYNAMO_EXTRA_FIELDS=worker_id,timing
      - CACHE_CONTROL_TTL=1h
      - DYNAMO_CACHE_CONTROL_JSON=
      - DYNAMO_NVEXT_JSON=
      - DYNAMO_EXTRA_INPUTS_JSON=
      - DYNAMO_IGNORE_EOS=true
      - AIPERF_PATCH_DYNAMO_STREAM_EVENTS=true
      - AIPERF_PATCH_DYNAMO_AGENT_HINTS=true
      - SERVER_METRICS=true
      - AIPERF_UI_TYPE=none
      - REQUEST_TIMEOUT_SECONDS=900
      - RANDOM_SEED=0
      - OUTPUT_DIR=/results/aiperf-router-demo
      - AIPERF_EXTRA_ARGS=
  - name: aiperf-router-demo-scripts
    files:
      - run-aiperf-router-demo.py
      - sitecustomize.py
