apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - results-pvc.yaml
  - job.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: dynosim-aiperf-demo
    app.kubernetes.io/part-of: qwen36-photo-demo

configMapGenerator:
  - name: dynosim-aiperf-demo-config
    literals:
      - AIPERF_PIP_SPEC=aiperf==0.7.0
      - EXTRA_PIP_PACKAGES=
      - RUN_DYNOSIM=true
      - RUN_AIPERF=true
      - ENDPOINT_URL=http://qwen36-35b-vllm-agg-frontend:8000
      - MODEL_NAME=nvidia/Qwen3.6-35B-A3B-NVFP4
      - TOKENIZER_NAME=nvidia/Qwen3.6-35B-A3B-NVFP4
      - TOKENIZER_TRUST_REMOTE_CODE=true
      - PREFIX_RATIOS=0.05,0.25,0.5,0.75,0.95
      - INPUT_SEQUENCE_LENGTH=8192
      - OUTPUT_SEQUENCE_LENGTH=1024
      - REQUEST_COUNT=500
      - CONCURRENCY=8
      - NUM_PREFIX_PROMPTS=8
      - DYNOSIM_NUM_WORKERS=2
      - DYNOSIM_ROUTER_MODES=kv_router
      - DYNOSIM_REPLAY_MODE=offline
      - DYNOSIM_ARRIVAL_INTERVAL_MS=0
      - DYNOSIM_TURNS_PER_SESSION=1
      - DYNOSIM_INTER_TURN_DELAY_MS=0
      - 'DYNOSIM_ENGINE_ARGS_JSON={"engine_type":"vllm","block_size":64,"enable_prefix_caching":true,"enable_chunked_prefill":true,"max_num_seqs":4,"max_num_batched_tokens":2048}'
      - 'DYNOSIM_ROUTER_CONFIG_JSON={"router_queue_policy":"fcfs"}'
      - DYNOSIM_EXTRA_ARGS=
      - DYNAMO_AGENT_HINTS_ENABLED=true
      - DYNAMO_AGENT_HINTS_DYNAMIC_OSL=true
      - DYNAMO_AGENT_HINTS_JSON=
      - REQUEST_PRIORITY=5
      - USE_EXPECTED_OSL=true
      - SPECULATIVE_PREFILL=false
      - DYNAMO_EXTRA_FIELDS=worker_id,timing
      - CACHE_CONTROL_TTL=1h
      - DYNAMO_CACHE_CONTROL_JSON=
      - DYNAMO_NVEXT_JSON=
      - DYNAMO_EXTRA_INPUTS_JSON=
      - DYNAMO_IGNORE_EOS=true
      - AIPERF_PATCH_DYNAMO_STREAM_EVENTS=true
      - AIPERF_PATCH_DYNAMO_AGENT_HINTS=true
      - SERVER_METRICS=true
      - AIPERF_UI_TYPE=none
      - REQUEST_TIMEOUT_SECONDS=900
      - RANDOM_SEED=0
      - OUTPUT_DIR=/results/dynosim-aiperf-demo
      - AIPERF_EXTRA_ARGS=
      - GENERATE_DGDR_SPEC=true
      - DGDR_NAME=qwen36-dynosim-candidate
      - DGDR_NAMESPACE=
      - DGDR_IMAGE=nvcr.io/nvidia/ai-dynamo/dynamo-planner:1.1.1
      - DGDR_BACKEND=vllm
      - DGDR_SEARCH_STRATEGY=rapid
      - DGDR_AUTO_APPLY=false
      - DGDR_TTFT_MS=500
      - DGDR_ITL_MS=50
      - DGDR_E2E_LATENCY_MS=
      - DGDR_WORKLOAD_ISL=
      - DGDR_WORKLOAD_OSL=
      - DGDR_INCLUDE_CONCURRENCY=true
      - DGDR_CONCURRENCY=
      - DGDR_REQUEST_RATE=
      - DGDR_USE_AIPERF_REQUEST_RATE=false
      - DGDR_HARDWARE_GPU_SKU=
      - DGDR_HARDWARE_TOTAL_GPUS=
      - DGDR_HARDWARE_NUM_GPUS_PER_NODE=
      - DGDR_HARDWARE_VRAM_MB=
      - DGDR_HARDWARE_INTERCONNECT=
      - DGDR_HARDWARE_RDMA=
      - DGDR_MODEL_CACHE_PVC_NAME=
      - DGDR_MODEL_CACHE_PVC_MOUNT_PATH=
      - DGDR_MODEL_CACHE_PVC_MODEL_PATH=
      - DGDR_PLANNER_ENABLED=false
      - DGDR_PLANNER_JSON=
      - DGDR_OVERRIDES_PROFILING_JOB_JSON=
      - DGDR_OVERRIDES_DGD_JSON=
  - name: dynosim-aiperf-demo-scripts
    files:
      - run-dynosim-aiperf-demo.py
      - sitecustomize.py
