apiVersion: batch/v1
kind: Job
metadata:
  name: dynosim-aiperf-demo
  labels:
    app.kubernetes.io/name: dynosim-aiperf-demo
    app.kubernetes.io/part-of: nemotron-omni-photo-demo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynosim-aiperf-demo
        app.kubernetes.io/part-of: nemotron-omni-photo-demo
    spec:
      restartPolicy: Never
      containers:
        - name: dynosim-aiperf
          image: daedalus.ddns.me:5050/btuttle/nemotron-3-nano-omni:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
          args:
            - |
              case "${RUN_AIPERF:-true}" in
                1|true|TRUE|True|yes|YES|Yes|on|ON|On)
                  install_aiperf=true
                  ;;
                *)
                  install_aiperf=false
                  ;;
              esac
              if [ "${install_aiperf}" = "true" ]; then
                case "${AIPERF_PIP_SPEC} ${EXTRA_PIP_PACKAGES}" in
                  *git+*)
                    apt-get update
                    apt-get install -y --no-install-recommends git
                    rm -rf /var/lib/apt/lists/*
                    ;;
                esac
                python -m pip install --upgrade --disable-pip-version-check pip
                python -m pip install --no-cache-dir "${AIPERF_PIP_SPEC}" ${EXTRA_PIP_PACKAGES}
              fi
              python /scripts/run-dynosim-aiperf-demo.py
          envFrom:
            - configMapRef:
                name: dynosim-aiperf-demo-config
            - secretRef:
                name: hf-token-secret
                optional: true
          env:
            - name: HF_HOME
              value: /results/hf
            - name: HF_HUB_CACHE
              value: /results/hf/hub
            - name: TRANSFORMERS_CACHE
              value: /results/hf/transformers
            - name: AIPERF_ARTIFACT_ROOT
              value: /results/dynosim-aiperf-demo/aiperf
            - name: PYTHONPATH
              value: /scripts
            - name: DYN_LOG
              value: info,dynamo_kv_router::scheduling::selector=warn
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
            limits:
              cpu: "8"
              memory: 24Gi
      volumes:
        - name: scripts
          configMap:
            name: dynosim-aiperf-demo-scripts
            defaultMode: 0555
        - name: results
          persistentVolumeClaim:
            claimName: dynosim-aiperf-demo-results
