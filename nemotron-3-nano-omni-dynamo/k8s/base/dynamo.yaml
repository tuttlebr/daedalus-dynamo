apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: nemotron-omni-vllm-agg
  labels:
    app.kubernetes.io/name: nemotron-omni-vllm-agg
    app.kubernetes.io/part-of: nemotron-omni-photo-demo
spec:
  backendFramework: vllm
  pvcs:
    - name: model-cache
      create: false
  services:
    Frontend:
      componentType: frontend
      envFromSecret: hf-token-secret
      replicas: 1
      volumeMounts:
        - name: model-cache
          mountPoint: /model
      extraPodSpec:
        mainContainer:
          image: daedalus.ddns.me:5050/btuttle/nemotron-3-nano-omni:latest
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 1800
            failureThreshold: 60
          env:
            - name: HF_HUB_CACHE
              value: /model/.model-express/cache
            - name: DYN_HTTP_BODY_LIMIT_MB
              value: "200"
            - name: DYN_REQUEST_PLANE
              value: tcp
            - name: DYN_EVENT_PLANE
              value: zmq
            - name: DYN_FRONTEND_NOFILE_LIMIT
              value: "65536"
            - name: DYN_TOKENIZER
              value: "fastokens"
            - name: DYN_ROUTER_QUEUE_POLICY
              value: "wspt"
          command:
            - /bin/bash
            - -lc
          args:
            - >-
              ulimit -n "${DYN_FRONTEND_NOFILE_LIMIT}" &&
              unset NATS_SERVER &&
              exec python3 -m dynamo.frontend
              --router-mode kv
              --no-router-kv-events
              --router-min-initial-workers 1
              --enable-anthropic-api
              --strip-anthropic-preamble
              --enable-streaming-tool-dispatch
              --enable-streaming-reasoning-dispatch
              --http-port 8000
              --active-decode-blocks-threshold "None"
              --active-prefill-tokens-threshold "None"
              --active-prefill-tokens-threshold-frac "None"
              --router-track-output-blocks

    ModelExpress:
      componentType: frontend
      envFromSecret: hf-token-secret
      replicas: 1
      # resources:
      #   requests:
      #     cpu: "4"
      #     memory: 16Gi
      #   limits:
      #     cpu: "8"
      #     memory: 32Gi
      livenessProbe:
        tcpSocket:
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        tcpSocket:
          port: 8000
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      volumeMounts:
        - name: model-cache
          mountPoint: /model
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/modelexpress-server:0.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_EXPRESS_SERVER_PORT
              value: "8000"
            - name: MODEL_EXPRESS_LOG_LEVEL
              value: info
            - name: MODEL_EXPRESS_CACHE_DIRECTORY
              value: /model/.model-express/cache
            - name: MX_METADATA_BACKEND
              value: redis
            - name: MX_REDIS_HOST
              value: redis
            - name: MX_REDIS_PORT
              value: "6379"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: MODEL_NAME
              value: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
            - name: MODEL_CACHE_PATH
              value: /model/.model-express/cache
            - name: HF_HUB_CACHE
              value: /model/.model-express/cache
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail

              echo "Waiting for Redis metadata backend..."
              for i in $(seq 1 60); do
                if timeout 1 bash -c "</dev/tcp/${MX_REDIS_HOST}/${MX_REDIS_PORT}" 2> /dev/null; then
                  echo "Redis is reachable."
                  break
                fi
                if [ "$i" -eq 60 ]; then
                  echo "ERROR: Redis did not become reachable at ${MX_REDIS_HOST}:${MX_REDIS_PORT}" >&2
                  exit 1
                fi
                echo "Waiting for Redis... ($i/60)"
                sleep 2
              done

              echo "Starting Model Express Server..."
              ./modelexpress-server &

              SERVER_PID=$!
              echo "Server started with PID: $SERVER_PID"

              echo "Setting up Model Express configuration..."
              mkdir -p "$MODEL_CACHE_PATH"
              mkdir -p /model/.model-express
              cat > /model/.model-express/config.yaml << EOF
              local_path: $MODEL_CACHE_PATH
              server_endpoint: http://nemotron-omni-vllm-agg-modelexpress:8000
              timeout_secs: null
              EOF

              echo "Waiting for server to be ready..."
              for i in $(seq 1 60); do
                if ./modelexpress-cli --endpoint http://localhost:8000 health > /dev/null 2>&1; then
                  echo "Server is ready!"
                  break
                fi
                echo "Waiting for server... ($i/60)"
                sleep 2
              done

              echo "Downloading $MODEL_NAME model..."
              ./modelexpress-cli --endpoint http://localhost:8000 \
                --cache-path "$MODEL_CACHE_PATH" \
                model download "$MODEL_NAME" --strategy server-only

              SNAPSHOTS_PARENT="$MODEL_CACHE_PATH/models--${MODEL_NAME//\//--}/snapshots"
              SNAPSHOT_DIR="$(ls -td "$SNAPSHOTS_PARENT"/*/ 2>/dev/null | head -1 || true)"
              if [ -n "$SNAPSHOT_DIR" ]; then
                SNAPSHOTS_PARENT=$(dirname "$SNAPSHOT_DIR")
                ln -sfn "$(basename "$SNAPSHOT_DIR")" "$SNAPSHOTS_PARENT/latest"
                echo "Created symlink: latest -> $(basename "$SNAPSHOT_DIR")"
              fi

              echo "Server PID: $SERVER_PID"
              wait "$SERVER_PID"

    VllmWorker:
      componentType: worker
      envFromSecret: hf-token-secret
      replicas: 1
      resources:
        limits:
          gpu: "1"
        requests:
          gpu: "1"
      livenessProbe:
        httpGet:
          path: /live
          port: system
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      readinessProbe:
        httpGet:
          path: /health
          port: system
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      volumeMounts:
        - name: model-cache
          mountPoint: /model
      sharedMemory:
        size: 64Gi
      extraPodSpec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nvidia.com/gpu.memory
                      operator: Gt
                      values:
                        - "40959"
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    nvidia.com/dynamo-graph-deployment-name: nemotron-omni-vllm-agg
                    nvidia.com/dynamo-component: VllmWorker
                topologyKey: kubernetes.io/hostname
        mainContainer:
          image: daedalus.ddns.me:5050/btuttle/nemotron-3-nano-omni:latest
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 360
          env:
            - name: MODEL_NAME
              value: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
            - name: HF_HUB_CACHE
              value: /model/.model-express/cache
            - name: MODEL_CACHE_PATH
              value: /model/.model-express/cache
            - name: MODEL_EXPRESS_URL
              value: http://nemotron-omni-vllm-agg-modelexpress:8000
            - name: MODEL_EXPRESS_HOST
              value: nemotron-omni-vllm-agg-modelexpress
            - name: MODEL_EXPRESS_PORT
              value: "8000"
            - name: DYN_VLLM_EMBEDDING_TRANSFER_MODE
              value: local
            - name: DYN_MULTIMODAL_EMBEDDING_CACHE_GB
              value: "4"
            - name: DYN_MM_ALLOW_INTERNAL
              value: "1"
            - name: DYN_MM_VIDEO_NUM_FRAMES
              value: "256"
            - name: DYN_REQUEST_PLANE
              value: tcp
            - name: DYN_EVENT_PLANE
              value: zmq
            - name: DYN_HTTP_BODY_LIMIT_MB
              value: "400"
            - name: DYN_WORKER_NOFILE_LIMIT
              value: "65536"
            - name: UCX_NET_DEVICES
              value: eth0
            - name: UCX_TLS
              value: tcp,cuda_copy,cuda_ipc
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              ulimit -n "${DYN_WORKER_NOFILE_LIMIT}"
              ulimit -l unlimited

              echo "Waiting for ModelExpress at ${MODEL_EXPRESS_HOST}:${MODEL_EXPRESS_PORT}..."
              for i in $(seq 1 180); do
                if timeout 1 bash -c "</dev/tcp/${MODEL_EXPRESS_HOST}/${MODEL_EXPRESS_PORT}" 2> /dev/null; then
                  echo "ModelExpress is reachable."
                  break
                fi
                if [ "$i" -eq 180 ]; then
                  echo "ERROR: ModelExpress did not become reachable at ${MODEL_EXPRESS_HOST}:${MODEL_EXPRESS_PORT}" >&2
                  exit 1
                fi
                echo "Waiting for ModelExpress... ($i/180)"
                sleep 2
              done

              exec python3 -m dynamo.vllm \
                --model "${MODEL_NAME}" \
                --served-model-name "${MODEL_NAME}" \
                --enable-multimodal \
                --frontend-decoding \
                --multimodal-embedding-cache-capacity-gb "${DYN_MULTIMODAL_EMBEDDING_CACHE_GB}" \
                --mm-processor-cache-gb 8 \
                --media-io-kwargs '{"video":{"num_frames":256,"fps":1}}' \
                --video-pruning-rate 0.5 \
                --trust-remote-code \
                --dyn-tool-call-parser nemotron_nano \
                --dyn-reasoning-parser nemotron_nano \
                --tensor-parallel-size 1 \
                --pipeline-parallel-size 1 \
                --data-parallel-size 1 \
                --gpu-memory-utilization 0.90 \
                --max-num-batched-tokens 2560 \
                --max-model-len auto \
                --max-num-seqs 8 \
                --enable-chunked-prefill \
                --scheduling-policy priority \
                --enable-prefix-caching \
                --prefix-caching-hash-algo sha256 \
                --no-enable-log-requests
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
                - SYS_RESOURCE
