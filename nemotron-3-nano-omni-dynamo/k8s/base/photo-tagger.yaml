apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-tagger
  labels:
    app.kubernetes.io/name: photo-tagger
    app.kubernetes.io/part-of: nemotron-omni-photo-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: photo-tagger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photo-tagger
        app.kubernetes.io/part-of: nemotron-omni-photo-demo
    spec:
      securityContext:
        runAsUser: 977
        runAsGroup: 988
        runAsNonRoot: true
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: photo-tagger
          image: photo-tagger:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: LISTEN_ADDR
            - name: LLM_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: LLM_ENDPOINT
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: MODEL_NAME
            - name: PHOTO_TAGGER_REQUIRE_AUTH
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: PHOTO_TAGGER_REQUIRE_AUTH
            - name: PHOTO_TAGGER_AUTH_USER
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: PHOTO_TAGGER_AUTH_USER
            - name: PHOTO_TAGGER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: photo-tagger-auth
                  key: token
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photo-tagger-postgres
                  key: password
            - name: DATABASE_URL
              value: postgres://photo_tagger:$(POSTGRES_PASSWORD)@photo-tagger-postgres:5432/photo_tagger
            - name: WRITE_SIDECAR
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: WRITE_SIDECAR
            - name: SIDECAR_ROOTS
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: SIDECAR_ROOTS
            - name: ALLOWED_ROOTS
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: ALLOWED_ROOTS
            - name: MAX_CONCURRENT_LLM
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: MAX_CONCURRENT_LLM
            - name: MAX_CONCURRENT_HASH
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: MAX_CONCURRENT_HASH
            - name: MAX_FILE_BYTES
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: MAX_FILE_BYTES
            - name: MAX_IMAGE_PIXELS
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: MAX_IMAGE_PIXELS
            - name: MAX_EDGE_PIXELS
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: MAX_EDGE_PIXELS
            - name: DOWNSCALE_LARGE
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: DOWNSCALE_LARGE
            - name: LLM_TIMEOUT_SECS
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: LLM_TIMEOUT_SECS
            - name: LLM_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: LLM_MAX_RETRIES
            - name: JPEG_QUALITY
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: JPEG_QUALITY
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: photo-tagger-config
                  key: RUST_LOG
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 8Gi
          startupProbe:
            exec:
              command: ["wget", "-qO-", "--timeout=3", "http://127.0.0.1:3000/health"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["wget", "-qO-", "--timeout=3", "http://127.0.0.1:3000/ready"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data-photos
              mountPath: /data/photos
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data-photos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: photo-tagger
  labels:
    app.kubernetes.io/name: photo-tagger
    app.kubernetes.io/part-of: nemotron-omni-photo-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: photo-tagger
  ports:
    - name: http
      port: 3000
      targetPort: 3000
