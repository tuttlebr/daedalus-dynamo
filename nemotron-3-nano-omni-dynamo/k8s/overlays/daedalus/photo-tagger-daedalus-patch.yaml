apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-tagger
spec:
  template:
    metadata:
      annotations:
        photo-tagger/deployment-profile: daedalus
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - daedalus-02
                      - daedalus-03
                      - daedalus-04
      containers:
        - name: photo-tagger
          volumeMounts:
            - name: volume1-homes
              mountPath: /volume1/homes
              readOnly: true
            - name: volume2-daedalus
              mountPath: /volume2/daedalus
              readOnly: false
      volumes:
        - name: volume1-homes
          nfs:
            server: 192.168.1.232
            path: /volume1/homes
            readOnly: true
        - name: volume2-daedalus
          nfs:
            server: 192.168.1.77
            path: /var/nfs/shared/daedalus
