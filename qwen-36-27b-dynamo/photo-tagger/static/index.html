<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Photo Tagger - Qwen</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .nv-green { color: #76b900; }
  .bg-nv-green { background-color: #76b900; }
  .border-nv-green { border-color: #76b900; }
  pre { white-space: pre-wrap; word-break: break-word; }
  details > summary { cursor: pointer; }
  .tag-chip { display:inline-block; background:#1f2937; color:#d1d5db; padding:.1rem .5rem; border-radius:9999px; font-size:.7rem; margin:.1rem .15rem; }
  .scrollbar-thin::-webkit-scrollbar { width: 8px; height:8px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<header class="border-b border-zinc-800 bg-zinc-900/70 backdrop-blur sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between gap-6">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-md bg-nv-green flex items-center justify-center font-bold text-black">PT</div>
      <div>
        <h1 class="text-lg font-semibold">Photo Tagger</h1>
        <div class="text-xs text-zinc-400">Qwen image cataloging</div>
      </div>
    </div>
    <nav class="flex gap-1 bg-zinc-800/60 rounded-md p-1">
      <button data-tab="scan"   class="tab-btn px-3 py-1.5 rounded text-sm font-medium">Scan</button>
      <button data-tab="jobs"   class="tab-btn px-3 py-1.5 rounded text-sm font-medium">Jobs</button>
      <button data-tab="search" class="tab-btn px-3 py-1.5 rounded text-sm font-medium">Search</button>
      <button data-tab="browse" class="tab-btn px-3 py-1.5 rounded text-sm font-medium">Browse</button>
    </nav>
    <div class="text-sm flex items-center gap-3" id="status-bar">
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-zinc-500" id="hb-database"></span> database</span>
      <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-zinc-500" id="hb-endpoint"></span> qwen</span>
      <span class="text-zinc-400" id="hb-stats">— processed</span>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-6 space-y-6">

  <!-- Scan tab -->
  <section data-tab-pane="scan" class="tab-pane space-y-6">
    <div class="bg-zinc-900 rounded-lg border border-zinc-800 p-5">
      <h2 class="font-semibold text-base mb-4">Start a scan</h2>
      <form id="scan-form" class="grid sm:grid-cols-[1fr_auto_auto] gap-3 items-end">
        <label class="block">
          <span class="text-xs uppercase tracking-wide text-zinc-400">Path</span>
          <input id="scan-path" type="text" required
                 placeholder="/volume2/photos/2025"
                 class="mt-1 w-full bg-zinc-950 border border-zinc-700 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-nv-green/40" />
        </label>
        <label class="flex items-center gap-2 mb-1">
          <input id="scan-recursive" type="checkbox" checked class="accent-[#76b900]" />
          <span class="text-sm">Recursive</span>
        </label>
        <button type="submit" class="bg-nv-green hover:brightness-110 text-black font-medium px-5 py-2 rounded-md text-sm">
          Start
        </button>
      </form>
      <p class="text-xs text-zinc-500 mt-3">
        Paths must be inside the allowed roots (default <code class="text-zinc-300">/volume1</code>, <code class="text-zinc-300">/volume2</code>).
      </p>
    </div>

    <div id="active-jobs" class="space-y-3"></div>
  </section>

  <!-- Jobs tab -->
  <section data-tab-pane="jobs" class="tab-pane space-y-3 hidden">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold">All jobs</h2>
      <button id="refresh-jobs" class="text-xs px-3 py-1.5 bg-zinc-800 rounded">Refresh</button>
    </div>
    <div class="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-zinc-800/60 text-zinc-400 text-xs uppercase tracking-wide">
          <tr>
            <th class="text-left px-3 py-2">Status</th>
            <th class="text-left px-3 py-2">Started</th>
            <th class="text-left px-3 py-2">Root</th>
            <th class="text-right px-3 py-2">Seen</th>
            <th class="text-right px-3 py-2">Processed</th>
            <th class="text-right px-3 py-2">Skipped</th>
            <th class="text-right px-3 py-2">Failed</th>
          </tr>
        </thead>
        <tbody id="jobs-table"></tbody>
      </table>
    </div>
  </section>

  <!-- Search tab -->
  <section data-tab-pane="search" class="tab-pane space-y-4 hidden">
    <form id="search-form" class="flex gap-3">
      <input id="search-q" type="text" placeholder='Try: "sunset beach", "cat on couch", "snow mountain"…'
             class="flex-1 bg-zinc-900 border border-zinc-800 rounded-md px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-nv-green/40" />
      <button class="bg-nv-green text-black font-medium px-5 py-2.5 rounded-md text-sm">Search</button>
    </form>
    <p id="search-meta" class="text-xs text-zinc-500"></p>
    <div id="search-results" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </section>

  <!-- Browse tab -->
  <section data-tab-pane="browse" class="tab-pane space-y-4 hidden">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold">Recently processed</h2>
      <button id="refresh-browse" class="text-xs px-3 py-1.5 bg-zinc-800 rounded">Refresh</button>
    </div>
    <div id="browse-results" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </section>

</main>

<!-- Modal -->
<div id="modal" class="fixed inset-0 hidden z-30 bg-black/70 backdrop-blur-sm items-center justify-center p-4">
  <div class="bg-zinc-900 border border-zinc-800 rounded-lg max-w-5xl w-full max-h-[90vh] overflow-hidden flex flex-col">
    <div class="flex items-center justify-between px-5 py-3 border-b border-zinc-800">
      <h3 id="modal-title" class="font-semibold text-sm truncate">Metadata</h3>
      <button id="modal-close" class="text-zinc-400 hover:text-white text-xl leading-none">&times;</button>
    </div>
    <div class="grid md:grid-cols-2 gap-4 p-4 overflow-auto scrollbar-thin">
      <div>
        <img id="modal-img" class="w-full max-h-[70vh] object-contain rounded bg-black" />
        <div id="modal-tags" class="mt-3"></div>
        <p id="modal-caption" class="mt-2 text-sm"></p>
        <p id="modal-description" class="mt-1 text-zinc-400 text-sm"></p>
      </div>
      <div>
        <pre id="modal-json" class="text-xs bg-zinc-950 border border-zinc-800 rounded p-3 max-h-[80vh] overflow-auto scrollbar-thin"></pre>
        <div class="flex gap-2 mt-3">
          <button id="reprocess-btn" class="text-xs px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded">Reprocess</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => Array.from(root.querySelectorAll(s));

// ---------- Tabs ----------
function showTab(name) {
  $$('.tab-pane').forEach(el => el.classList.toggle('hidden', el.dataset.tabPane !== name));
  $$('.tab-btn').forEach(b => {
    const active = b.dataset.tab === name;
    b.classList.toggle('bg-zinc-700', active);
    b.classList.toggle('text-white', active);
    b.classList.toggle('text-zinc-300', !active);
  });
}
$$('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
showTab('scan');

// ---------- Health & stats heartbeat ----------
async function refreshHealth() {
  try {
    const [h, s] = await Promise.all([
      fetch('/ready').then(r => r.json()),
      fetch('/stats').then(r => r.json()),
    ]);
    $('#hb-database').className = 'w-2 h-2 rounded-full ' + (h.database ? 'bg-emerald-500' : 'bg-red-500');
    $('#hb-endpoint').className = 'w-2 h-2 rounded-full ' + (h.endpoint_reachable ? 'bg-emerald-500' : 'bg-red-500');
    $('#hb-stats').textContent = `${s.processed.toLocaleString()} processed · ${s.failed.toLocaleString()} failed`;
  } catch (e) {
    $('#hb-database').className = 'w-2 h-2 rounded-full bg-red-500';
    $('#hb-endpoint').className = 'w-2 h-2 rounded-full bg-red-500';
  }
}
refreshHealth();
setInterval(refreshHealth, 10000);

// ---------- Scan ----------
const activeJobsEl = $('#active-jobs');
const activeStreams = new Map(); // jobId -> EventSource

$('#scan-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const path = $('#scan-path').value.trim();
  const recursive = $('#scan-recursive').checked;
  if (!path) return;
  try {
    const r = await fetch('/scan', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path, recursive}),
    });
    const data = await r.json();
    if (!r.ok) {
      alert(data.error || 'Failed to start scan');
      return;
    }
    attachJob(data.job_id, path);
  } catch (err) { alert(String(err)); }
});

function attachJob(jobId, root) {
  const tile = document.createElement('div');
  tile.dataset.jobId = jobId;
  tile.className = 'bg-zinc-900 rounded-lg border border-zinc-800 p-4';
  const safeRoot = escapeHtml(root);
  const safeJobId = escapeHtml(jobId);
  tile.innerHTML = `
    <div class="flex items-center justify-between">
      <div>
        <div class="text-sm font-mono text-zinc-400 truncate" title="${safeRoot}">${safeRoot}</div>
        <div class="text-xs text-zinc-500">id ${safeJobId.slice(0,8)}</div>
      </div>
      <span class="js-status text-xs px-2 py-1 rounded-full bg-zinc-800">running</span>
    </div>
    <div class="mt-3 grid grid-cols-5 gap-2 text-xs">
      <div><div class="text-zinc-500">Seen</div><div class="js-seen text-base font-semibold">0</div></div>
      <div><div class="text-zinc-500">Processed</div><div class="js-processed text-base font-semibold text-emerald-400">0</div></div>
      <div><div class="text-zinc-500">Skipped</div><div class="js-skipped text-base font-semibold text-zinc-300">0</div></div>
      <div><div class="text-zinc-500">Failed</div><div class="js-failed text-base font-semibold text-red-400">0</div></div>
      <div><div class="text-zinc-500">Transcoded</div><div class="js-transcoded text-base font-semibold">0</div></div>
    </div>
    <div class="mt-3 h-1.5 bg-zinc-800 rounded overflow-hidden">
      <div class="js-bar h-full bg-nv-green" style="width:0%"></div>
    </div>
    <div class="js-current text-xs text-zinc-500 mt-2 truncate"></div>
  `;
  activeJobsEl.prepend(tile);

  const es = new EventSource(`/jobs/${jobId}/events`);
  activeStreams.set(jobId, es);

  function applyProgress(s) {
    tile.querySelector('.js-seen').textContent = s.total_seen;
    tile.querySelector('.js-processed').textContent = s.processed;
    tile.querySelector('.js-skipped').textContent = s.skipped_dedup;
    tile.querySelector('.js-failed').textContent = s.failed;
    tile.querySelector('.js-transcoded').textContent = s.transcoded;
    const denom = Math.max(s.total_seen, 1);
    const pct = ((s.processed + s.skipped_dedup + s.failed) / denom * 100).toFixed(1);
    tile.querySelector('.js-bar').style.width = pct + '%';
    tile.querySelector('.js-current').textContent = s.current_path || '';
    tile.querySelector('.js-status').textContent = s.status;
    tile.querySelector('.js-status').className = 'js-status text-xs px-2 py-1 rounded-full ' + (
      s.status === 'completed' ? 'bg-emerald-700/40 text-emerald-300' :
      s.status === 'completed_with_failures' ? 'bg-amber-700/40 text-amber-300' :
      s.status === 'failed'    ? 'bg-red-700/40 text-red-300' :
      'bg-zinc-800 text-zinc-300'
    );
  }
  es.addEventListener('progress', e => applyProgress(JSON.parse(e.data)));
  es.addEventListener('completed', e => {
    applyProgress(JSON.parse(e.data).summary);
    es.close();
    activeStreams.delete(jobId);
    refreshHealth();
  });
  es.addEventListener('failed', e => {
    const data = JSON.parse(e.data);
    tile.querySelector('.js-current').textContent = 'Failed: ' + (data.message || '');
    es.close();
  });
}

// ---------- Jobs tab ----------
async function refreshJobs() {
  try {
    const jobs = await fetch('/jobs').then(r => r.json());
    const tbody = $('#jobs-table');
    if (!jobs.length) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-zinc-500 py-6">No jobs yet</td></tr>`;
      return;
    }
    tbody.innerHTML = jobs.map(j => `
      <tr class="border-t border-zinc-800 hover:bg-zinc-800/40">
        <td class="px-3 py-2"><span class="text-xs px-2 py-0.5 rounded-full ${
          j.status === 'completed' ? 'bg-emerald-700/40 text-emerald-300' :
          j.status === 'completed_with_failures' ? 'bg-amber-700/40 text-amber-300' :
          j.status === 'failed'    ? 'bg-red-700/40 text-red-300' :
          'bg-zinc-800 text-zinc-300'
        }">${escapeHtml(j.status)}</span></td>
        <td class="px-3 py-2 text-zinc-400">${escapeHtml(j.started_at.replace('T',' ').slice(0,19))}</td>
        <td class="px-3 py-2 font-mono text-xs truncate max-w-[400px]" title="${escapeHtml(j.root)}">${escapeHtml(j.root)}</td>
        <td class="px-3 py-2 text-right">${escapeHtml(j.total_seen)}</td>
        <td class="px-3 py-2 text-right text-emerald-300">${escapeHtml(j.processed)}</td>
        <td class="px-3 py-2 text-right text-zinc-400">${escapeHtml(j.skipped_dedup)}</td>
        <td class="px-3 py-2 text-right text-red-300">${escapeHtml(j.failed)}</td>
      </tr>
    `).join('');
  } catch (e) {}
}
$('#refresh-jobs').addEventListener('click', refreshJobs);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshJobs(); });
setInterval(refreshJobs, 8000);
refreshJobs();

// ---------- Search ----------
$('#search-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = $('#search-q').value.trim();
  if (!q) return;
  const data = await fetch(`/search?q=${encodeURIComponent(q)}&limit=120`).then(r => r.json());
  $('#search-meta').textContent = `${data.total} hit${data.total===1?'':'s'} for "${data.query}"`;
  renderCards($('#search-results'), data.hits);
});

// ---------- Browse ----------
async function refreshBrowse() {
  const data = await fetch('/browse?limit=60').then(r => r.json());
  renderCards($('#browse-results'), data.hits);
}
$('#refresh-browse').addEventListener('click', refreshBrowse);
refreshBrowse();

function renderCards(container, hits) {
  if (!hits.length) {
    container.innerHTML = `<div class="text-zinc-500 text-sm col-span-full py-8 text-center">No results.</div>`;
    return;
  }
  container.innerHTML = hits.map(h => `
    <button data-path="${escapeHtml(h.path)}" class="card text-left bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden hover:border-zinc-600 transition">
      <div class="aspect-square bg-black overflow-hidden">
        <img loading="lazy" src="/thumb?path=${encodeURIComponent(h.path)}"
             onerror="this.style.display='none'"
             class="w-full h-full object-cover" />
      </div>
      <div class="p-3 space-y-1">
        <div class="text-sm line-clamp-2">${escapeHtml(h.caption || '(no caption)')}</div>
        <div class="text-[10px] text-zinc-500 font-mono truncate" title="${escapeHtml(h.path)}">${escapeHtml(basename(h.path))}</div>
        <div class="flex flex-wrap">
          ${(h.tags || []).slice(0, 6).map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>
    </button>
  `).join('');
  container.querySelectorAll('.card').forEach(b => b.addEventListener('click', () => openModal(b.dataset.path)));
}

function basename(p) { return p.split('/').pop() || p; }
function escapeHtml(s='') { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ---------- Modal ----------
async function openModal(path) {
  $('#modal-title').textContent = path;
  $('#modal-img').src = `/thumb?path=${encodeURIComponent(path)}`;
  try {
    const m = await fetch(`/metadata?path=${encodeURIComponent(path)}`).then(r => r.ok ? r.json() : null);
    if (!m) { $('#modal-json').textContent = 'No metadata found.'; $('#modal-caption').textContent=''; $('#modal-description').textContent=''; $('#modal-tags').innerHTML=''; }
    else {
      $('#modal-json').textContent = JSON.stringify(m, null, 2);
      $('#modal-caption').textContent = m.content?.caption || '';
      $('#modal-description').textContent = m.content?.description || '';
      $('#modal-tags').innerHTML = (m.content?.tags || []).map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('');
    }
    $('#reprocess-btn').onclick = async () => {
      if (!confirm('Re-run the LLM on this image?')) return;
      const r = await fetch('/reprocess', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({path}),
      });
      if (r.ok) {
        const data = await r.json();
        showTab('scan');
        attachJob(data.job_id, path);
        $('#modal').classList.add('hidden');
      } else {
        alert('Reprocess failed');
      }
    };
  } catch (e) { $('#modal-json').textContent = String(e); }
  $('#modal').classList.remove('hidden');
  $('#modal').classList.add('flex');
}
$('#modal-close').addEventListener('click', () => { $('#modal').classList.add('hidden'); $('#modal').classList.remove('flex'); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') { $('#modal').classList.add('hidden'); $('#modal').classList.remove('flex'); } });
</script>
</body>
</html>
