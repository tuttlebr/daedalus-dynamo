apiVersion: v1
kind: Service
metadata:
  name: photo-tagger-postgres
  labels:
    app.kubernetes.io/name: photo-tagger-postgres
    app.kubernetes.io/part-of: qwen36-photo-demo
spec:
  selector:
    app.kubernetes.io/name: photo-tagger-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: photo-tagger-postgres
  labels:
    app.kubernetes.io/name: photo-tagger-postgres
    app.kubernetes.io/part-of: qwen36-photo-demo
spec:
  serviceName: photo-tagger-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: photo-tagger-postgres
  template:
    metadata:
        labels:
          app.kubernetes.io/name: photo-tagger-postgres
          app.kubernetes.io/part-of: qwen36-photo-demo
    spec:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 977
            runAsGroup: 988
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: photo_tagger
            - name: POSTGRES_USER
              value: photo_tagger
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photo-tagger-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: photo-tagger-postgres
          app.kubernetes.io/part-of: qwen36-photo-demo
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
